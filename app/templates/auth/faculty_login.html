<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Portal Login - Central College Examination Authority</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: #0a192f; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;">
  <div style="max-width: 440px; width: 100%; margin: 0 auto; padding: 24px 16px;">
    <!-- Brand Top -->
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="{{ url_for('home') }}" style="display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none;">
        <div style="width: 44px; height: 44px; border-radius: var(--radius-md); background: #2563eb; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800;">
          🛡️
        </div>
        <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em;">Quiz Management System</span>
      </a>
      <h2 style="font-size: 22px; font-weight: 900; margin-top: 14px; color: #fff;">Faculty Portal Login</h2>
      <p style="font-size: 12px; color: #94a3b8; margin-top: 4px;">
        Authorized faculty access for quiz management, question authoring, and student evaluations.
      </p>
    </div>

    <!-- Login Card -->
    <div class="card" style="background: #ffffff; color: var(--foreground); box-shadow: var(--shadow-xl); border: none;">
      <div class="card-header" style="background: #f8fafc; border-bottom: 1px solid var(--border-color); padding: 18px 24px;">
        <h3 class="card-title" style="font-size: 15px; display: flex; align-items: center; gap: 8px;">
          <span>🔒</span>
          <span>Secure Faculty Sign In</span>
        </h3>
        <p class="card-desc">Enter your verified institutional credentials to continue.</p>
      </div>

      <div class="card-body" style="padding: 24px;">
        <div id="facultyLoginError" class="alert alert-danger hidden"></div>

        <form id="facultyLoginForm" onsubmit="handleFacultyLogin(event)">
          <div class="form-group">
            <label class="form-label" for="faculty_email">Institutional Email *</label>
            <input type="email" id="faculty_email" name="email" class="form-control" placeholder="faculty@college.edu" autocomplete="username" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="faculty_password">Password *</label>
            <input type="password" id="faculty_password" name="password" class="form-control" placeholder="••••••••••••" autocomplete="current-password" required>
          </div>

          <div style="margin-top: 24px;">
            <button type="submit" id="facultyLoginBtn" class="btn btn-navy btn-lg" style="width: 100%;">
              <span>🔑 Authenticate Faculty</span>
            </button>
          </div>
        </form>
      </div>

      <div class="card-footer" style="display: flex; justify-content: space-between; font-size: 12px;">
        <a href="{{ url_for('home') }}" style="color: var(--text-muted); text-decoration: none;">← Back to Home</a>
        <a href="{{ url_for('auth.student_login_page') }}" style="color: var(--secondary); font-weight: 700; text-decoration: none;">Student Login →</a>
      </div>
    </div>
  </div>

  <script>
  async function handleFacultyLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('facultyLoginBtn');
    const errBox = document.getElementById('facultyLoginError');
    errBox.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Authenticating...';

    const payload = {
      email: document.getElementById('faculty_email').value.trim(),
      password: document.getElementById('faculty_password').value.trim()
    };

    try {
      const res = await fetch('/api/auth/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (data.success) {
        window.location.href = "{{ url_for('faculty.faculty_dashboard') }}";
      } else {
        errBox.textContent = data.message || 'Invalid credentials. Please verify your email and password.';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = '🔑 Authenticate Faculty';
      }
    } catch (err) {
      errBox.textContent = 'Network communication failure. Please check your connection.';
      errBox.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = '🔑 Authenticate Faculty';
    }
  }
  </script>
</body>
</html>
