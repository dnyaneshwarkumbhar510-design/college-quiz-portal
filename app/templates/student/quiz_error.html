{% extends "base.html" %}

{% block title %}Examination Notice{% endblock %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px;">
  <div class="card" style="max-width: 460px; width: 100%; padding: 32px; text-align: center;">
    <div style="font-size: 40px; margin-bottom: 12px;">⚠️</div>
    <h2 style="font-size: 20px; font-weight: 800; color: #0f172a;">Examination Notice</h2>
    <p style="font-size: 13px; color: var(--text-muted); margin: 10px 0 24px; line-height: 1.5;">
      {{ message or "The requested examination session is not available or has expired." }}
    </p>
    <a href="{{ url_for('student.student_dashboard') }}" class="btn btn-navy btn-md" style="width: 100%;">
      Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
